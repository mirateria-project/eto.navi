<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>しーちゃんの干支ナビ</title>
<meta name="theme-color" content="#3247a4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="干支ナビ">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* VOICE: にぎやか・やさしい。沖縄のお祭り気分
   IDEA: 神社でもらう干支早見表を、しーちゃんが案内する
   PICTURE: しーちゃん＋吹き出し、大きな干支カード
   COLOUR: 海の青、ハイビスカスの赤、太陽の黄色
   TYPE: 太い丸ゴシック、大きな数字 */
:root{color-scheme:light;--sea:#1d74c9;--deep:#1b3a8f;--red:#e8344e;--sun:#ffc83d;--ink:#1d2433;--card:#ffffff;--gray:#3b3f47}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:17px/1.55 "Hiragino Maru Gothic ProN","Hiragino Sans","Rounded Mplus 1c","Noto Sans JP",system-ui,sans-serif;overflow-x:clip;
 background:linear-gradient(180deg,#58c6ef 0,#9fe3f7 260px,#fff6d8 620px,#ffe9ef 100%);min-height:100vh;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 40px;position:relative}
/* deco */
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sky i{position:absolute;font-style:normal;opacity:.75;animation:float 9s linear infinite}
@keyframes float{from{transform:translateY(105vh) rotate(0)}to{transform:translateY(-15vh) rotate(360deg)}}
.wrap>*{position:relative;z-index:1}
header{display:flex;align-items:center;gap:10px;padding:6px 2px 10px}
header img{width:52px;height:52px;border-radius:12px;box-shadow:0 3px 8px #0003}
h1{margin:0;font-size:clamp(24px,6.5vw,34px);line-height:1.1;color:#fff;text-shadow:0 2px 0 var(--deep),0 0 12px #0004;letter-spacing:.02em}
h1 small{display:block;font-size:14px;text-shadow:0 1px 0 var(--deep)}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:8px;align-items:end;margin-bottom:12px}
.shi{position:relative}
.shi img{width:100%;display:block;filter:drop-shadow(0 6px 6px #0003);transform-origin:50% 100%}
.shi img.talk{animation:paku .28s ease-in-out infinite alternate}
@keyframes paku{from{transform:scaleY(1) scaleX(1)}to{transform:scaleY(.95) scaleX(1.03)}}
.bal{position:relative;background:#fff;border:4px solid var(--red);border-radius:22px;padding:14px 14px;font-size:17px;font-weight:700;min-height:120px;box-shadow:0 5px 0 #0002;margin-bottom:28%}
.bal::before{content:"";position:absolute;left:-18px;bottom:26px;border:12px solid transparent;border-right:16px solid var(--red)}
.bal::after{content:"";position:absolute;left:-9px;bottom:30px;border:8px solid transparent;border-right:11px solid #fff}
/* cards */
.card{background:var(--card);border-radius:22px;padding:16px;margin:0 0 14px;box-shadow:0 6px 0 #0000001a,0 2px 10px #0001;border:3px solid #fff}
.card h2{margin:0 0 10px;font-size:21px;line-height:1.25;color:var(--deep);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .tag{font-size:13px;background:var(--sun);color:#5a3c00;border-radius:99px;padding:2px 10px}
/* picker */
.pick{display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:10px;align-items:stretch}
.wheelbox{position:relative;height:280px;border-radius:18px;background:#eef6ff;overflow:hidden;border:3px solid #cfe3fb}
.wheelbox::before{content:"";position:absolute;left:6px;right:6px;top:112px;height:56px;border-radius:14px;background:var(--sun);box-shadow:0 0 0 3px #ffb300 inset;pointer-events:none}
.wheel{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;padding:112px 0;scrollbar-width:none;overscroll-behavior:contain}
.wheel::-webkit-scrollbar{display:none}
.wi{height:56px;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:22px;position:relative;color:#57627a;white-space:nowrap}
.wi small{font-size:14px;font-weight:700}
.wi.on{color:#3b2500}
.arrows{display:grid;grid-template-rows:1fr 1fr;gap:10px}
.btn{appearance:none;border:0;border-radius:16px;font:inherit;font-weight:800;cursor:pointer;min-height:48px;padding:10px 14px;background:var(--sea);color:#fff;box-shadow:0 5px 0 #0d4c8a;transition:transform .06s,box-shadow .06s,filter .06s;touch-action:manipulation}
.btn:active,.btn.pr{transform:translateY(5px);box-shadow:0 0 0 #0000;filter:brightness(.85)}
.btn.red{background:var(--red);box-shadow:0 5px 0 #9c1830}
.btn.yel{background:var(--sun);color:#4a3000;box-shadow:0 5px 0 #c58f00}
.btn.gray{background:#e4e8ef;color:#2a3140;box-shadow:0 5px 0 #b3bac6}
.arrows .btn{font-size:26px}
.sex{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sex .btn{background:#e4e8ef;color:#2a3140;box-shadow:0 5px 0 #b3bac6;font-size:19px}
.sex .btn.sel{background:var(--deep);color:#fff;box-shadow:0 5px 0 #0b1f55}
/* banner */
.banner{background:var(--gray);border-radius:18px;padding:10px;margin:0 0 14px;text-align:center;box-shadow:0 5px 0 #0003}
.banner a{display:block;text-decoration:none;color:#fff}
.banner img{width:100%;display:block;border-radius:10px}
.banner .addr{font-size:14px;margin-top:6px;color:#f1f1f1}
.np{display:none;margin-top:10px;border-radius:12px;overflow:hidden;background:#111;cursor:pointer}
.np.show{display:block}
.np span{display:inline-block;white-space:nowrap;font-weight:900;font-size:18px;padding:10px 12px;animation:npin 3s ease-out forwards, rainbow 1.2s linear 3s infinite}
@keyframes npin{from{transform:translateX(100vw)}to{transform:translateX(0)}}
@keyframes rainbow{0%{color:#ff3b3b;text-shadow:0 0 10px #ff3b3b}25%{color:#ffe23b;text-shadow:0 0 10px #ffe23b}50%{color:#3bff7a;text-shadow:0 0 10px #3bff7a}75%{color:#3bc9ff;text-shadow:0 0 10px #3bc9ff}100%{color:#ff3bd8;text-shadow:0 0 10px #ff3bd8}}
/* result */
.res-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.etoBig{width:108px;height:108px;border-radius:26px;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc83d 70%);display:grid;place-items:center;box-shadow:0 5px 0 #c58f00}
.etoBig b{font-size:58px;line-height:1;color:#7a1d00;font-family:"Hiragino Mincho ProN","Noto Serif JP",serif}
.etoName{font-size:26px;font-weight:900;line-height:1.2}
.etoName small{display:block;font-size:15px;font-weight:700;color:#5b667e}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.num{background:#eef6ff;border-radius:16px;padding:10px 6px;text-align:center}
.num div{font-size:13px;color:#4c5872;font-weight:700}
.num b{font-size:clamp(26px,8vw,36px);line-height:1.15;color:var(--deep);white-space:nowrap}
.num b small{font-size:15px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.bd{border-radius:14px;padding:8px 12px;font-weight:800;font-size:16px;line-height:1.3}
.bd.yaku{background:#ffe1e6;color:#a3102a;border:2px solid var(--red)}
.bd.yaku.main{background:var(--red);color:#fff;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px #e8344e44}}
.bd.ok{background:#e3f7ea;color:#16683a;border:2px solid #36b56a}
.bd.tsb{background:#fff1c7;color:#7a4b00;border:2px solid #f0a800}
.bd.fs{background:#e9e4ff;color:#3e2a9b;border:2px solid #7d68e8}
.trait{margin-top:10px;font-size:15px;color:#4c5872}
/* fortune */
.fortune{background:linear-gradient(135deg,#ff7aa2,#ffb36b);color:#fff;border-color:#fff}
.fortune h2{color:#fff}
.stars{font-size:28px;letter-spacing:2px;color:#fff59d;text-shadow:0 2px 0 #c2410c}
.fbox{background:#ffffff2e;border-radius:14px;padding:10px 12px;margin-top:8px;font-weight:700}
.chip{display:inline-block;width:22px;height:22px;border-radius:50%;vertical-align:-5px;border:3px solid #fff;margin-right:6px}
/* list */
.ev{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;padding:10px 0;border-top:2px dashed #e3e7ef;align-items:center}
.ev:first-of-type{border-top:0}
.ev .y{font-weight:900;font-size:20px;color:var(--deep);white-space:nowrap}
.ev .y small{display:block;font-size:12px;color:#66708a;font-weight:700}
.ev .t{font-weight:700}
.ev .t small{display:block;color:#66708a;font-weight:600;font-size:14px}
.note{font-size:14px;color:#55607a;background:#f4f6fa;border-radius:12px;padding:10px 12px;margin-top:10px}
/* family */
.fam{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border-radius:16px;background:#f4f8ff;margin-bottom:8px;cursor:pointer;border:3px solid transparent}
.fam.cur{border-color:var(--sun);background:#fff9e0}
.fam .k{width:50px;height:50px;border-radius:14px;background:var(--sun);display:grid;place-items:center;font-size:28px;font-weight:900;color:#7a1d00;font-family:"Hiragino Mincho ProN",serif}
.fam .n{font-weight:800}
.fam .n small{display:block;font-weight:600;color:#5b667e;font-size:14px}
.fam .del{min-height:44px;width:44px;padding:0;font-size:20px}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:8px}
input[type=text]{font:inherit;font-size:17px;border:3px solid #cfe3fb;border-radius:14px;padding:10px 12px;min-height:48px;width:100%}
input[type=text]:focus{outline:3px solid var(--sun);border-color:var(--sun)}
/* table */
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.tabs .btn{padding:6px 0;min-height:52px;font-size:22px;font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;background:#e4e8ef;color:#2a3140;box-shadow:0 4px 0 #b3bac6}
.tabs .btn.sel{background:var(--red);color:#fff;box-shadow:0 4px 0 #9c1830}
.tbl{width:100%;border-collapse:collapse;margin-top:12px;font-size:16px}
.tbl th{font-size:13px;color:#55607a;text-align:left;padding:6px 4px;border-bottom:2px solid #dde3ee}
.tbl td{padding:8px 4px;border-bottom:1px solid #eef1f6;white-space:nowrap}
.tbl td.r{text-align:right;font-weight:900;color:var(--deep);font-size:18px}
.tbl tr.me td{background:#fff3c4}
.yk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.yk h3{margin:0 0 6px;font-size:17px}
.yk div.row{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;padding:6px 8px;border-radius:10px;background:#f6f7fb;margin-bottom:5px;font-size:15px}
.yk div.row b{color:var(--red)}
/* bottom */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tools .btn,.tools a.btn{display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;font-size:16px;line-height:1.25}
.ig{background:linear-gradient(45deg,#f9a825,#e91e63,#8e24aa)!important;box-shadow:0 5px 0 #6a1b9a!important}
.ver{text-align:center;font-size:13px;color:#5b667e;margin-top:14px}
/* modal */
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.mbox{background:#fff;border-radius:20px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:14px;text-align:center}
.mbox img{width:100%;border-radius:12px;display:block}
.mbox p{margin:10px 0;font-weight:700}
.mbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.privacy{position:fixed;inset:0;z-index:60;background:#000c;display:none;align-items:center;justify-content:center;padding:20px}
.privacy.show{display:flex}
.privacy div{background:#fff;color:#d40000;font-weight:900;font-size:20px;border-radius:18px;padding:20px;max-width:520px;text-align:center;border:4px solid #d40000}
.privacy small{display:block;color:#333;font-size:14px;margin-top:10px;font-weight:700}
@media (prefers-reduced-motion:reduce){.sky i,.shi img.talk,.bd.yaku.main,.np span{animation:none}}
@media (max-width:380px){.etoBig{width:88px;height:88px}.etoBig b{font-size:46px}.tabs .btn{font-size:19px}}
</style>
</head>
<body>

<div class="wrap" id="app">
 <header>

   <a class="btn ig" href="https://www.instagram.com/mirateria.project/" target="_blank" rel="noopener" data-en="Instagram">インスタグラム</a>
   <button class="btn gray" id="topBtn" data-en="Back to top">いちばん上へ</button>
  </div>

  <div class="ver" id="ver"></div>
 </section>
</div>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="privacy" id="privacy"><div><span data-en="This app does not collect or send personal information. It only receives banner notices.">本アプリは個人情報を収集・送信しません。通信はバナー広告の受信のみを行います。</span><small data-en="Tap to close">タップで閉じます</small></div></div>

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const etoJ=k=>YOMI[k]===ANI_J[k]?`${YOMI[k]}年`:`${YOMI[k]}年（${ANI_J[k]}）`;
const etoIdx=y=>((y-4)%12+12)%12;
function wareki(y){
  const out=[];
  for(let i=0;i<ERAS.length;i++){const e=ERAS[i];if(y>=e.s){const n=y-e.s+1;out.push(JA?`${e.j}${n===1?'元':n}年`:`${e.e} ${n}`);if(y===e.s&&ERAS[i+1]){const p=ERAS[i+1];out.push(JA?`${p.j}${y-p.s+1}年`:`${p.e} ${y-p.s+1}`)}break}}
  return out.join(JA?'・':' / ');
}
function yakuOf(kazoe,sex){
  const tb=YAKU[sex];
  for(const k in tb){const b=+k,big=tb[k];
    if(kazoe===b)return{type:'main',base:b,big};
    if(kazoe===b-1)return{type:'pre',base:b,big};
    if(kazoe===b+1)return{type:'post',base:b,big};}
  return null;
}
function yakuLabel(r){
  if(!r)return'';
  const n={pre:t('前厄','Pre-yaku'),main:r.big?t('大厄（本厄）','Major yaku'):t('本厄','Main yaku'),post:t('後厄','Post-yaku')}[r.type];
  return n;
}
const fsN=sex=>sex==='F'?7:8, fsMax=sex=>sex==='F'?49:64;
const isFS=(age,sex)=>age>0&&age%fsN(sex)===0&&age<=fsMax(sex);
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}

/* ---------- person info ---------- */
function info(year,sex){
  const age=Y-year,kazoe=age+1,k=etoIdx(year),yk=yakuOf(kazoe,sex);
  const tsb=TSB.includes(kazoe), cj=CHOJU[kazoe], fs=isFS(age,sex);
  return{year,sex,age,kazoe,k,yk,tsb,cj,fs};
}
function events(p,limit){
  const out=[];
  for(let kz=p.kazoe+1;kz<=110&&out.length<limit;kz++){
    const age=kz-1,y=p.year+age,list=[];
    const yk=yakuOf(kz,p.sex);if(yk)list.push({c:'yaku',txt:yakuLabel(yk)});
    if(TSB.includes(kz))list.push({c:'tsb',txt:kz===97?t('トゥシビー（カジマヤー）','Tushibi (Kajimaya)'):t('トゥシビー（生年祝い）','Tushibi (birth-year celebration)')});
    else if(CHOJU[kz])list.push({c:'tsb',txt:t(CHOJU[kz][0],CHOJU[kz][1])});
    if(isFS(age,p.sex))list.push({c:'fs',txt:t('体の節目','Body milestone')});
    if(list.length)out.push({y,age,kz,list});
  }
  return out;
}

function shiSay(p){
  const name=S.cur!=null&&S.fam[S.cur]?S.fam[S.cur].name:'';
  const who=name?t(`${name}は`,`${name}: `):'';
  if(p.yk&&p.yk.type==='main')return t(`${who}今年は${yakuLabel(p.yk)}！ 神社でお祓いをして、健康診断も受けておくと安心だよ`,`${who}This is your ${yakuLabel(p.yk)} year! A shrine blessing and a health checkup will put your mind at ease.`);
  if(p.yk)return t(`${who}今年は${yakuLabel(p.yk)}だよ。むりをしないで、体の声を聞いてね`,`${who}This is your ${yakuLabel(p.yk)} year. Don't overdo it, listen to your body.`);

  if(p.tsb)return t(`${who}今年はトゥシビー！ 生まれ年のお祝いだよ。おめでとう🎉`,`${who}It's your Tushibi year, an Okinawan birth-year celebration! 🎉`);
  if(p.cj)return t(`${who}今年は${p.cj[0]}のお祝い！ おめでとう🎉`,`${who}Congratulations on your ${p.cj[1]}! 🎉`);
  const d=new Date().toISOString().slice(0,10),i=hash(d+p.k+'tip')%TIPS.length;
  return t(`${who}${ANI_J[p.k]}年さん、今日のひとことは「${TIPS[i][0]}」だよ`,`${who}Hi ${ANI_E[p.k]}! Today's tip: ${TIPS[i][1]}.`);
}

  add(t('■ これからの節目','■ Coming milestones'),38,'#1b3a8f',1);
  events(p,6).forEach(e=>add(`${e.y}${t('年','')}（${t(`${e.age}歳・数え${e.kz}`,`age ${e.age}, kazoe ${e.kz}`)}）  ${e.list.map(x=>x.txt).join('・')}`,30));
  if(S.fam.length){add(t('■ 家族・友だち','■ Family'),38,'#1b3a8f',1);
    S.fam.forEach(f=>{const q=info(f.year,f.sex);add(`${f.name}  ${ETO[q.k]}  ${f.year}${t('年生','')}  ${q.age}${t('歳','')}  ${q.yk?yakuLabel(q.yk):''} ${q.tsb?t('トゥシビー','Tushibi'):''} ${q.fs?t('節目','Milestone'):''}`,30)})}
  add(t(`■ ${Y}年の厄年`,`■ Yakudoshi in ${Y}`),38,'#1b3a8f',1);
  for(const sex of ['M','F']){const tb=YAKU[sex];const parts=[];for(const k in tb){const b=+k;for(const [kz,ty] of [[b-1,'pre'],[b,'main'],[b+1,'post']])parts.push(`${Y-kz+1}${t('年生','')} ${yakuLabel({type:ty,big:tb[k]})}`)}add(`${sex==='M'?t('男性','Men'):t('女性','Women')}： ${parts.join(' ／ ')}`,28)}
  add(t('厄年・体の節目は昔からの言い伝えです。病気を当てるものではありません。','Yakudoshi and milestones are traditions, not predictions of illness.'),26,'#55607a');
  add(`MIRATERIA ${t('沖縄県島尻郡八重瀬町長毛379-3','Yaese, Okinawa')}  Instagram: mirateria.project  v${VERSION}`,24,'#55607a');
  const wrap=(b)=>{c.font=`${b.bold?800:600} ${b.size}px ${FONT}`;const maxW=W-PAD*2-(b.bg?40:0);const lines=[];let line='';for(const ch of [...b.txt]){if(c.measureText(line+ch).width>maxW&&line){lines.push(line);line=ch}else line+=ch}if(line)lines.push(line);return lines};
  const HEAD=300;let H=HEAD;const laid=blocks.map(b=>{const l=wrap(b);const h=l.length*b.size*1.4+(b.bg?40:0)+18;H+=h;return{b,l,h}});H+=40;
  cv.width=W;cv.height=H;
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#58c6ef');g.addColorStop(.25,'#fff6d8');g.addColorStop(1,'#ffe9ef');c.fillStyle=g;c.fillRect(0,0,W,H);
  const [shi,logo]=await Promise.all([loadImg('shichan.png'),loadImg('logo.jpg')]);
  if(logo){const lw=W-PAD*2-240,lh=lw*logo.height/logo.width;c.fillStyle='#3b3f47';c.fillRect(PAD-10,40-10,lw+20,lh+20);c.drawImage(logo,PAD,40,lw,lh)}
  if(shi){const sh=250,sw=sh*shi.width/shi.height;c.drawImage(shi,W-PAD-sw,20,sw,sh)}
  let y=HEAD;
  for(const {b,l,h} of laid){c.font=`${b.bold?800:600} ${b.size}px ${FONT}`;c.textBaseline='top';
    if(b.bg){c.fillStyle=b.bg;c.beginPath();c.roundRect?c.roundRect(PAD,y,W-PAD*2,h-18,20):c.rect(PAD,y,W-PAD*2,h-18);c.fill()}
    c.fillStyle=b.color;l.forEach((ln,i)=>c.fillText(ln,PAD+(b.bg?20:0),y+(b.bg?20:0)+i*b.size*1.4));y+=h}
  return cv;
}
$('shotBtn').onclick=async()=>{
  openModal(`<p>${t('画像を作っています…','Making image…')}</p>`);
  try{const cv=await makeShot();const url=cv.toDataURL('image/png');
    openModal(`<p>${t('画像を長押しして「写真に保存」してね','Long-press the image to save it')}</p><img src="${url}" alt=""><div class="mbtns"><button class="btn red" id="shareBtn">${t('共有・保存','Share / Save')}</button><button class="btn gray" data-close>${t('閉じる','Close')}</button></div>`);
    $('shareBtn').onclick=async()=>{try{const blob=await (await fetch(url)).blob();const file=new File([blob],`eto-navi-${S.year}.png`,{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]})}else{const a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove()}}catch(e){}};
  }catch(e){openModal(`<p>${t('画像を作れませんでした','Could not make the image')}</p><div class="mbtns"><button class="btn gray" data-close>${t('閉じる','Close')}</button></div>`)}
};

/* ---------- privacy (first time only) ---------- */
if(!S.seenPrivacy){$('privacy').classList.add('show')}
$('privacy').addEventListener('click',()=>{$('privacy').classList.remove('show');S.seenPrivacy=true;save()});

/* ---------- new product banner (receive only) ---------- */
async function checkBanner(){
  if(!navigator.onLine)return;
  try{const ctl=new AbortController();setTimeout(()=>ctl.abort(),6000);
    const r=await fetch(BANNER_URL+'?t='+Date.now(),{cache:'no-store',signal:ctl.signal});if(!r.ok)return;const d=await r.json();
    const np=d&&(d.newProduct||d.new_product);if(!np||!np.text)return;
    $('npText').textContent='✨ '+String(np.text).slice(0,80)+' ✨';$('np').classList.add('show');
    $('np').onclick=()=>{if(np.image&&/^https:\/\//.test(np.image))openModal(`<img src="${esc(np.image)}" alt=""><p>${esc(np.text)}</p><div class="mbtns"><button class="btn gray" data-close>${t('閉じる','Close')}</button></div>`)};
  }catch(e){}
}

/* ---------- start ---------- */
renderYaku();addEventListener('resize',()=>renderYaku());
renderAll(false);
requestAnimationFrame(()=>{wheelTo(S.year,false);markWheel();speak(shiSay(info(S.year,S.sex)))});
checkBanner();

/* ---------- offline & auto update ---------- */
if('serviceWorker' in navigator){
  try{const had=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').then(reg=>{reg.update().catch(()=>{})}).catch(()=>{});
    let done=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!done){done=true;save();location.reload()}});
  }catch(e){}
}
}
</script>
